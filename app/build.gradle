import java.util.Properties

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Read versionName from the single source of truth: VERSION at project root
def versionNameFromFile = rootProject.file("VERSION").text.trim()

// Load keystore.properties if it exists (not committed to git)
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.hape.pdfscan"
    compileSdk = 37

    defaultConfig {
        applicationId = "com.hape.pdfscan"
        minSdk = 29
        targetSdk = 35
        versionCode = 2
        versionName = versionNameFromFile

        // No emulator support: package only ARM native libs (drops x86/x86_64 from OpenCV etc.)
        ndk {
            abiFilters += ['arm64-v8a', 'armeabi-v7a']
        }

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }
    }

    signingConfigs {
        if (hasKeystore) {
            release {
                // storeFile is optional in keystore.properties; default keystore lies in the project root
                storeFile = rootProject.file(keystoreProperties.getProperty("storeFile", "patch-key.jks"))
                storePassword = keystoreProperties.getProperty("PAPYRUS_STORE_PASSWORD")
                keyAlias = keystoreProperties.getProperty("PAPYRUS_KEY_ALIAS")
                keyPassword = keystoreProperties.getProperty("PAPYRUS_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig = signingConfigs.release
            }
        }
        debug {
            debuggable = true
        }
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // Compose BOM – single source for all Compose library versions
    def composeBom = platform('androidx.compose:compose-bom:2026.09.00')
    implementation composeBom
    androidTestImplementation composeBom

    // Core & Lifecycle
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.activity:activity-compose:1.13.0'

    // Compose UI
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'

    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.10.2'

    // CameraX
    implementation 'androidx.camera:camera-core:1.6.2'
    implementation 'androidx.camera:camera-camera2:1.6.2'
    implementation 'androidx.camera:camera-lifecycle:1.6.2'
    implementation 'androidx.camera:camera-view:1.6.2'

    // DataStore
    implementation 'androidx.datastore:datastore-preferences:1.2.1'

    // OpenCV
    implementation 'org.opencv:opencv:5.0.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.1'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
